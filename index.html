<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style>
<title>CLP Practice Tests</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout concept: one narrow column like a driver's log. A sticky status bar carries the three exams and the
   progress count; each question is its own ruled card with a Not confident toggle beside the question number.
   Visual world: interstate signage, condensed DIN-style capitals, shield blue, caution amber for the flag. */
:root {
  --bg: #F2F5F9;
  --surface: #FFFFFF;
  --ink: #13202D;
  --muted: #546374;
  --line: #D3DBE5;
  --soft: #E7ECF3;
  --sel: #EAF1FB;
  --accent: #1F4E8C;
  --accent-ink: #FFFFFF;
  --flag: #F2B01E;
  --flag-ink: #2E2100;
  --flag-soft: #FFF1C9;
  --flag-text: #6B4B00;
  --ok: #156B40;
  --ok-soft: #DDF2E6;
  --bad: #B3261E;
  --bad-soft: #FBE3E0;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1620;
    --surface: #16212E;
    --ink: #E7EDF4;
    --muted: #9AA9BA;
    --line: #2A3A4C;
    --soft: #1D2B3B;
    --sel: #1B2D45;
    --accent: #7AABEB;
    --accent-ink: #0A1626;
    --flag: #F2B01E;
    --flag-ink: #2E2100;
    --flag-soft: #3A2E10;
    --flag-text: #F5C75B;
    --ok: #5CC38C;
    --ok-soft: #153325;
    --bad: #F0837B;
    --bad-soft: #3B1B19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1620;
  --surface: #16212E;
  --ink: #E7EDF4;
  --muted: #9AA9BA;
  --line: #2A3A4C;
  --soft: #1D2B3B;
  --sel: #1B2D45;
  --accent: #7AABEB;
  --accent-ink: #0A1626;
  --flag: #F2B01E;
  --flag-ink: #2E2100;
  --flag-soft: #3A2E10;
  --flag-text: #F5C75B;
  --ok: #5CC38C;
  --ok-soft: #153325;
  --bad: #F0837B;
  --bad-soft: #3B1B19;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.5 var(--font-body);
  padding-block: 0 56px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
.in {
  width: 100%;
  max-width: 792px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
button:focus-visible, .opt:has(input:focus-visible), .unsure:has(input:focus-visible) {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

/* Header */
.head { padding-block: 28px 18px; display: grid; gap: 8px; }
.eyebrow {
  margin: 0;
  font: 600 14px var(--font-display);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
}
h1 {
  margin: 0;
  font: 700 clamp(36px, 9vw, 56px)/.95 var(--font-display);
  letter-spacing: .02em;
  text-transform: uppercase;
  text-wrap: balance;
}
.lede { margin: 4px 0 0; max-width: 60ch; color: var(--muted); }

/* Sticky status bar */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.bar .in { padding-block: 10px 0; display: grid; gap: 8px; }
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tab {
  display: grid;
  gap: 0;
  text-align: left;
  padding: 7px 10px 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 4px;
  cursor: pointer;
  min-width: 0;
}
.tab .tn {
  font: 600 17px/1.15 var(--font-display);
  letter-spacing: .06em;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}
.tab .tc { font: 500 13px/1.3 var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab[aria-selected="true"] .tc { color: var(--accent-ink); opacity: .9; }
.prog { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; min-height: 38px; }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; }
.meter { height: 4px; background: var(--soft); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); }

/* Buttons */
.btn {
  font: 600 16px/1 var(--font-display);
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 12px 18px;
  min-height: 44px;
  border-radius: 4px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
  cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn.sm { min-height: 36px; padding: 9px 14px; font-size: 15px; }
.btn[hidden] { display: none; }

/* Test heading */
#listTop { scroll-margin-top: 150px; }
.thead { padding-block: 22px 14px; display: grid; gap: 2px; }
.thead h2 {
  margin: 0;
  font: 700 28px/1.05 var(--font-display);
  letter-spacing: .04em;
  text-transform: uppercase;
}
.thead p { margin: 0; color: var(--muted); max-width: 65ch; }

/* Questions */
#list { display: grid; gap: 14px; }
.q {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px 14px 16px;
  display: grid;
  gap: 12px;
}
.qhead { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.qn {
  font: 600 15px var(--font-display);
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.grp { border: 0; margin: 0; padding: 0; min-width: 0; }
.prompt { padding: 0; margin: 0 0 10px; width: 100%; font-size: 18px; font-weight: 600; line-height: 1.35; max-width: 65ch; text-wrap: pretty; }
.opts { display: grid; gap: 8px; }
.opt {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 12px;
  min-height: 46px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 6px;
  cursor: pointer;
}
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.opt .ltr {
  flex: none;
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--line);
  border-radius: 50%;
  font: 600 15px var(--font-display);
  color: var(--muted);
}
.opt .txt { min-width: 0; overflow-wrap: anywhere; padding-top: 1px; flex: 1; }
.opt .mark {
  flex: none;
  align-self: center;
  font: 600 13px var(--font-display);
  letter-spacing: .08em;
  text-transform: uppercase;
}
.opt.sel { border-color: var(--accent); background: var(--sel); }
.opt.sel .ltr { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .ltr { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.right .mark { color: var(--ok); }
.opt.wrongpick { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrongpick .ltr { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt.wrongpick .mark { color: var(--bad); }
.locked .opt, .locked .unsure { cursor: default; }

/* Not confident toggle */
.unsure {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px 6px 9px;
  min-height: 36px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  font: 600 15px var(--font-display);
  letter-spacing: .06em;
  text-transform: uppercase;
  cursor: pointer;
  user-select: none;
}
.unsure input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.unsure { position: relative; }
.unsure .dot {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  border: 2px solid var(--muted);
  border-radius: 50%;
}
.unsure.on { background: var(--flag); border-color: var(--flag); color: var(--flag-ink); }
.unsure.on .dot { border-color: var(--flag-ink); }
.unsure.on .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--flag-ink); }

/* Explanation after checking */
.why { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; }
.why p { margin: 0; max-width: 65ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font: 600 14px/1.5 var(--font-display);
  letter-spacing: .08em;
  text-transform: uppercase;
}
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.flag { background: var(--flag-soft); color: var(--flag-text); }
.answerline { font-weight: 600; }

/* Results */
.results { display: grid; gap: 16px; padding-block: 4px 10px; }
.score { display: flex; align-items: flex-end; gap: 6px 18px; flex-wrap: wrap; }
.big { font: 700 64px/.9 var(--font-display); font-variant-numeric: tabular-nums; }
.big .of { font-size: 34px; color: var(--muted); }
.scoretxt { display: grid; gap: 2px; padding-bottom: 4px; }
.scoretxt strong { font: 700 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.verdict { font-weight: 600; }
.verdict.pass { color: var(--ok); }
.verdict.fail { color: var(--bad); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.tlab { display: flex; align-items: center; gap: 8px; font: 600 16px var(--font-display); letter-spacing: .08em; text-transform: uppercase; }
.pt { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.pt.ok { background: var(--ok); }
.pt.flag { background: var(--flag); }
.pt.bad { background: var(--bad); }
.pt.gap { background: transparent; border: 2px solid var(--bad); }
.tnum { font: 700 36px/1.05 var(--font-display); font-variant-numeric: tabular-nums; }
.tdesc { font-size: 14px; color: var(--muted); }
.rnote { margin: 0; color: var(--muted); max-width: 65ch; }
.rbtns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button {
  background: var(--surface);
  border: 0;
  padding: 10px 14px;
  min-height: 44px;
  font: 600 15px var(--font-display);
  letter-spacing: .06em;
  text-transform: uppercase;
  cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; background: var(--soft); border-radius: 6px; }
.banner p { margin: 0; min-width: 0; flex: 1 1 240px; }
.empty { color: var(--muted); padding-block: 12px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 6px; }
.foot { color: var(--muted); font-size: 14px; max-width: 65ch; padding-top: 22px; }

@media (prefers-reduced-motion: no-preference) {
  .opt, .unsure, .tab, .btn { transition: background-color .12s, border-color .12s, color .12s; }
  .meter i { transition: width .2s; }
}
@media (max-width: 420px) {
  .tab { padding-inline: 8px; }
  .tab .tn { font-size: 16px; letter-spacing: .04em; }
  .big { font-size: 56px; }
}
</style>

</head><body>
<header class="in head">
  <p class="eyebrow">Florida commercial learner's permit</p>
  <h1>CLP Practice Tests</h1>
  <p class="lede">Pick an answer for each question. Switch on Not confident whenever you guessed or felt unsure. When you check your answers, your misses and lucky guesses are sorted so you know what to study first.</p>
</header>

<div class="bar">
  <div class="in">
    <div class="tabs" id="tabs" role="tablist" aria-label="Practice tests"></div>
    <div class="prog">
      <span class="count" id="count"></span>
      <button class="btn sm" type="button" data-act="check" id="barCheck">Check answers</button>
    </div>
  </div>
  <div class="meter" aria-hidden="true"><i id="meterFill"></i></div>
</div>

<main class="in">
  <div id="listTop"></div>
  <div class="thead"><h2 id="tTitle"></h2><p id="tSub"></p></div>
  <div id="list"></div>
  <p class="foot" id="foot">Progress saves as you go.</p>
</main>

<script>
(function () {
  "use strict";

  /* Each question: [prompt, options, index of correct option, explanation] */
  var TESTS = [
    {
      id: "general", name: "General Knowledge", short: "General",
      blurb: "Pre-trip inspection, braking, hazards, cargo, alcohol and fatigue, and emergencies.",
      qs: [
        ["How should your eyes work while you scan the road ahead?", ["Fixed straight ahead at all times", "Mostly toward the left lane", "Mostly toward the shoulder", "Moving between far and near, and back to the mirrors"], 3, "Keep your eyes moving. Look far ahead (12 to 15 seconds) and near, and check your mirrors regularly."],
        ["On a 20-inch steering wheel, free play beyond about how much can make the vehicle hard to steer?", ["None at all is allowed", "5 inches", "10 degrees (about 2 inches)", "20 degrees"], 2, "More than about 10 degrees of play (about 2 inches on a 20-inch wheel) can make steering difficult."],
        ["Why should you plan your response as soon as you spot a hazard?", ["So you can act smoothly before it becomes an emergency", "So you can ignore it", "So you can speed up", "So you can use your phone"], 0, "Early planning gives you time to slow, steer, or change lanes smoothly instead of braking hard or swerving."],
        ["About how long does a typical tractor-trailer need to clear a double set of railroad tracks?", ["About 5 seconds", "More than 15 seconds", "Exactly 10 seconds", "Under 8 seconds"], 1, "A typical tractor-trailer needs at least 14 seconds to clear a single track and more than 15 seconds for double tracks. Never start across unless you can clear."],
        ["What separates road rage from aggressive driving?", ["The time of day", "The type of vehicle", "The speed limit", "Road rage involves intent to harm or assault"], 3, "Aggressive driving is unsafe driving behavior, while road rage includes an intent to physically harm or an actual assault."],
        ["If you begin to hydroplane, what should you do?", ["Release the accelerator and push in the clutch; do not use the brakes", "Slam the brakes", "Speed up", "Let go of the wheel"], 0, "Releasing the accelerator and pushing in the clutch slows the vehicle and lets the wheels turn freely. Do not use the brakes to slow down while hydroplaning."],
        ["Which two things tell you when to shift gears?", ["Wind speed and traffic", "Fuel level and time", "Engine speed (RPM) and road speed", "Tire pressure and temperature"], 2, "Use engine RPM and road speed to know when to upshift or downshift."],
        ["What is the minimum tread depth for front (steering) tires?", ["2/32 inch", "4/32 inch", "1/32 inch", "1/2 inch"], 1, "Steering tires need at least 4/32 inch in every major groove. Other tires need at least 2/32 inch."],
        ["What does an anti-lock braking system do?", ["Always shortens stopping distance", "Adds braking power", "Replaces the need to steer", "Helps keep the wheels from locking so you can keep steering"], 3, "ABS prevents wheel lockup so you keep steering control. It doesn't necessarily shorten stopping distance."],
        ["Which helps you stay alert on a long drive?", ["Taking short breaks before you get drowsy", "Driving during your normal sleep hours", "Relying on coffee", "Keeping the cab very warm"], 0, "Stop for breaks before you feel sleepy. Caffeine and heat don't fix fatigue."],
        ["When is it appropriate to use your horn?", ["Whenever someone is in your way", "When you want to change lanes", "When it may help you avoid a crash by warning others", "Whenever you pass a vehicle"], 2, "Use the horn only when it can help prevent a crash. It can startle other drivers."],
        ["What should you look for when you inspect wheel bearing seals?", ["Fresh paint", "Signs of leaking", "Tire brand", "Dirt on the rim"], 1, "Leaking seals can let lubricant escape and cause a bearing failure or a hot wheel."],
        ["When should you use your four-way emergency flashers?", ["When you are stopped on the road or shoulder in an emergency or breakdown", "Whenever it rains", "While crossing railroad tracks", "Whenever you are on the highway"], 0, "Turn on the four-way flashers any time you are stopped on the road or shoulder for an emergency or breakdown, before you set out warning devices."],
        ["How do you check hydraulic brakes for a leak?", ["Listen for hissing", "Rev the engine", "Look under the vehicle", "Pump the pedal three times, then hold firm pressure for 5 seconds; it should not move"], 3, "Pump three times, apply firm pressure for five seconds, and the pedal should not move. If it does, there may be a leak."],
        ["What is the best way to deal with an aggressive driver?", ["Gesture back", "Brake hard in front of them", "Stay calm, avoid eye contact, and call police if you can safely", "Race them"], 2, "Don't engage. Stay calm, avoid eye contact, give them room, and report them to police if you can do so safely."],
        ["On a divided highway, where do you place warning devices when you must stop?", ["All within 10 feet of the vehicle", "At 10 feet, 100 feet, and 200 feet toward approaching traffic", "500 feet behind", "Only at the front"], 1, "On a divided or one-way road, place them at 10, 100, and 200 feet toward approaching traffic."],
        ["How can you measure your following distance in seconds?", ["Pick a fixed landmark; when the vehicle ahead passes it, count the seconds until you reach it", "Estimate by eye", "Check the speedometer", "Ask a passenger"], 0, "Count the seconds between the lead vehicle and you passing the same fixed point."],
        ["Why keep your ignition key with you during a pre-trip inspection?", ["To save weight", "To keep it clean", "Because the engine is off", "So no one else can start or move the vehicle while you are inspecting it"], 3, "Keep the key with you so no one can start or move the vehicle while you are under or near it."],
        ["How should you brake when you drive a tractor-trailer combination with ABS?", ["Pump the pedal", "Brake lightly at all times", "Brake as you always have, using only the force needed to stop safely and stay in control", "Use only the parking brake"], 2, "Brake the same way whether ABS is on the tractor, the trailer, or both. Back off the brakes if it is safe to do so to stay in control. (Exception: with working ABS on all axles of a straight truck or combination, you can fully apply the brakes in an emergency stop.)"],
        ["Why inspect the vehicle in the same order every time?", ["The law requires one exact order", "You're less likely to miss something", "It saves fuel", "It makes the truck cleaner"], 1, "A consistent routine helps you remember every item. The law requires the inspection, not a specific sequence."],
        ["What is the most important reason for a pre-trip inspection?", ["Safety", "Cleanliness", "Fuel economy", "Appearance"], 0, "The inspection finds problems that could cause a crash or breakdown."],
        ["How do you start from a stop on a hill without rolling back (manual transmission)?", ["Release the clutch quickly", "Rev the engine only", "Put the vehicle in neutral", "Partly engage the clutch before releasing the brake"], 3, "Ease the clutch to the friction point before you take your foot off the brake, and use the parking brake if needed."],
        ["What three distances make up total stopping distance?", ["Speed, weight, and braking", "Reaction, traction, and braking", "Perception, reaction, and braking", "Perception, weight, and traction"], 2, "Total stopping distance equals perception distance plus reaction distance plus braking distance."],
        ["You are given a sealed load to haul. What should you check before leaving?", ["Nothing, sealed loads have no paperwork", "That the seal number matches the shipping papers and the seal is intact", "Break the seal to look inside", "Remove the seal at the first stop"], 1, "Confirm the seal is intact and the number matches the paperwork. Never break the seal unless required."],
        ["Which of these is NOT the driver's responsibility regarding cargo?", ["Keeping the cargo fresh", "Inspecting it", "Making sure it's secure", "Recognizing overloads"], 0, "Drivers inspect cargo, secure it, and recognize overloads. Keeping cargo fresh is not part of that list."],
        ["As blood alcohol rises, what happens?", ["Only coordination is affected", "Only judgment is affected", "Nothing, until 0.20", "Judgment, self-control, coordination, and the brain are all increasingly affected"], 3, "Alcohol first reduces judgment and self-control, then coordination and muscle control as BAC climbs."],
        ["Is it safe to remove the radiator cap if the engine isn't overheating?", ["Yes, if there's no steam", "Yes, if the hood is open", "No, not when the system is hot or under pressure", "Yes, always"], 2, "Never remove the cap when the system is hot. Pressurized coolant can scald you."],
        ["Why limit use of the horn?", ["It wears out the bulb", "It can startle others, and on air-brake vehicles it uses air you may need", "It is illegal", "It drains the radio"], 1, "Horns can startle other drivers, and an air horn uses compressed air."],
        ["What can wet brakes do?", ["Apply unevenly, weakly, or grab", "Fall off", "Rust immediately", "Lock up permanently"], 0, "Water can make brakes pull to one side, grab, or work weakly. Test and dry them after driving through water."],
        ["How many tiedowns should cargo have at minimum, no matter how small it is?", ["None", "One", "Three", "Two"], 3, "Cargo should have at least one tiedown for each ten feet of cargo, and no matter how small, at least two tiedowns."],
        ["What are two key things to watch for ahead as you drive?", ["Gas stations", "Rest areas", "Other vehicles and traffic signs/signals", "Billboards"], 2, "Constantly scan for traffic and for signs, signals, and road conditions."],
        ["What can happen if you swing left before turning right?", ["Nothing", "Another driver may try to pass you on the right", "Your tires will wear less", "The turn will be easier"], 1, "Swinging left opens a gap that other drivers may try to fill on your right. Keep your rear close to the curb."],
        ["What is true about over-width, over-length, or over-weight loads?", ["They require a special permit", "They need no paperwork", "They may only travel at night", "They always need a police escort"], 0, "Oversize or overweight loads generally need a special permit. Escorts or time limits depend on the permit."],
        ["Which technique helps prevent rollback when starting uphill?", ["Release the clutch quickly", "Rev the engine first", "Put the transmission in neutral", "Use the parking brake until the clutch begins to engage"], 3, "Hold with the parking brake while you ease the clutch, and release the brake once the engine has enough pull."],
        ["Why is the pre-trip inspection worth doing every time?", ["To check the paint", "Because other drivers do", "It protects you and others by finding problems before they cause a crash", "To guard against theft"], 2, "Its purpose is safety for you and everyone else on the road."],

  /* ---------- scoring ---------- */
  function stats(id) {

    t.qs.forEach(function (q, i) {
      var a = s.answers[i], f = !!s.flags[i];
      if (a !== undefined) r.answered++;
      if (f) r.flagged++;
      if (a === q[2]) { r.correct++; if (f) r.lucky++; else r.solid++; }
      else if (f) r.gap++;
      else r.blind++;
    });
    r.pct = Math.round(100 * r.correct / r.total);
    return r;
  }
  function needs(id) {
    var t = T[id], s = S[id], out = [];

    return out;

  function scopeIdx(id) {
    var s = S[id];

      if (f) chip += '<span class="chip flag">Not confident</span>';
      why = '<div class="why"><div class="chips">' + chip + '</div>' +
        (ok ? "" : '<p class="answerline">Correct answer: ' + LET[q[2]] + ". " + esc(q[1][q[2]]) + "</p>") +
        "<p>" + esc(q[3]) + "</p></div>";
    }
    return '<article class="q' + (done ? " locked" : "") + '">' +
      '<div class="qhead"><span class="qn">Question ' + (i + 1) + " of " + t.qs.length + "</span>" +
      '<label class="unsure' + (f ? " on" : "") + '"><input type="checkbox" id="f' + cur + "-" + i + '" data-flag="' + i + '"' +
      (f ? " checked" : "") + (done ? " disabled" : "") + '><span class="dot"></span><span>Not confident</span></label></div>' +
      '<fieldset class="grp"><legend class="prompt">' + esc(q[0]) + '</legend><div class="opts">' + opts + "</div></fieldset>" +
      why + "</article>";
  }
  function tile(cls, label, n, desc) {
    return '<div class="tile"><span class="tlab"><i class="pt ' + cls + '"></i>' + label + '</span><span class="tnum">' + n +
      '</span><span class="tdesc">' + desc + "</span></div>";
  }
  function resultsHTML() {
    var s = S[cur], st = stats(cur), n = needs(cur).length, pass = st.pct >= PASS;
    var btns = "";
    if (n > 0) {
      btns += '<button class="btn" type="button" data-act="retake">Retake ' + n + " weak spot" + (n === 1 ? "" : "s") + "</button>";
      btns += '<div class="seg" role="group" aria-label="Show questions">' +
        '<button type="button" data-act="view" data-view="all" class="' + (view === "all" ? "on" : "") + '">All</button>' +
        '<button type="button" data-act="view" data-view="review" class="' + (view === "review" ? "on" : "") + '">Needs review (' + n + ")</button></div>";
    }
    if (s.focus) btns += '<button class="btn ghost" type="button" data-act="showall">Show all questions</button>';
    return '<section class="results" aria-label="Results">' +
      '<div class="score"><div class="big">' + st.correct + '<span class="of">/' + st.total + '</span></div>' +
      '<div class="scoretxt"><strong>' + st.pct + '%</strong><span class="verdict ' + (pass ? "pass" : "fail") + '">' +
      (pass ? "At or above the " + PASS + "% pass mark" : "Below the " + PASS + "% pass mark") + "</span></div></div>" +
      '<div class="tiles">' +
      tile("ok", "Solid", st.solid, "Right and confident") +
      tile("flag", "Lucky guesses", st.lucky, "Right, but not confident") +
      tile("bad", "Blind spots", st.blind, "Wrong, but felt sure") +
      tile("gap", "Known gaps", st.gap, "Wrong and not confident") + "</div>" +
      '<p class="rnote">' + (n > 0
        ? "Blind spots matter most, because you were sure and still missed them. Lucky guesses count toward your score, but treat them as unfinished."
        : "Every answer was right and confident. Retake the test later to make sure it holds.") + "</p>" +
      (btns ? '<div class="rbtns">' + btns + "</div>" : "") + "</section>";
  }
  function renderList() {
    var t = T[cur], s = S[cur], h = "";
    if (s.checked) h += resultsHTML();
    else if (s.focus) {
      h += '<div class="banner"><p>Weak-spot round: ' + s.focus.length + " question" + (s.focus.length === 1 ? "" : "s") +
        ". Your earlier answers on the other questions are kept.</p>" +
        '<button class="btn ghost sm" type="button" data-act="showall">Show all questions</button></div>';
    }
    var idx = scopeIdx(cur).filter(function (i) {
      if (s.checked && view === "review") return s.answers[i] !== t.qs[i][2] || s.flags[i];
      return true;
    });
    h += idx.length ? idx.map(qHTML).join("") : '<p class="empty">Nothing to show here.</p>';
    h += '<div class="actions">' +
      (s.checked ? "" : '<button class="btn" type="button" data-act="check">Check answers</button>') +
      '<button class="btn ghost" type="button" data-act="reset">Reset this test</button></div>';
    $("list").innerHTML = h;
  }
  function render() {
    var t = T[cur];
    $("tTitle").textContent = t.name;
    $("tSub").textContent = t.qs.length + " questions. " + t.blurb;
    renderList();
    updateBar();
  }
  function toTop() {
    $("listTop").scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "start" });
  }
  function switchTab(id) {
    if (!T[id] || id === cur) return;
    cur = id; view = "all"; confirmCheck = false; confirmReset = false;
    render();
  }

  /* ---------- actions ---------- */
  function doCheck() {
    var s = S[cur];
    var unans = scopeIdx(cur).filter(function (i) { return s.answers[i] === undefined; }).length;
    if (unans > 0 && !confirmCheck) { confirmCheck = true; updateBar(); return; }
    s.checked = true; confirmCheck = false; view = "all";
    touch(cur); render(); toTop();
  }
  function doRetake() {
    var s = S[cur], ids = needs(cur);
    ids.forEach(function (i) { delete s.answers[i]; delete s.flags[i]; });
    s.focus = ids; s.checked = false; view = "all"; confirmCheck = false;
    touch(cur); render(); toTop();
  }
  function doReset() {
    if (!confirmReset) { confirmReset = true; updateBar(); return; }
    S[cur] = blank(); confirmReset = false; confirmCheck = false; view = "all";
    touch(cur); render(); toTop();
  }

  document.addEventListener("click", function (e) {
    var tab = e.target.closest("[data-tab]");
    if (tab) {
      switchTab(tab.getAttribute("data-tab"));
      try { location.hash = cur; } catch (err) {}
      toTop();
      return;
    }
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act");
    if (act !== "reset" && confirmReset) { confirmReset = false; updateBar(); }
    if (act === "check") doCheck();
    else if (act === "reset") doReset();
    else if (act === "retake") doRetake();
    else if (act === "showall") { S[cur].focus = null; touch(cur); render(); toTop(); }
    else if (act === "view") { view = b.getAttribute("data-view"); renderList(); }
  });

  $("list").addEventListener("change", function (e) {
    var el = e.target, s = S[cur];
    if (el.type === "radio") {
      var i = +el.name.slice(1);
      s.answers[i] = +el.value;
      var opts = el.closest(".opts").querySelectorAll(".opt");
      for (var k = 0; k < opts.length; k++) opts[k].classList.toggle("sel", opts[k].contains(el));
    } else if (el.hasAttribute("data-flag")) {
      var n = el.getAttribute("data-flag");
      if (el.checked) s.flags[n] = 1; else delete s.flags[n];
      el.closest(".unsure").classList.toggle("on", el.checked);
    } else return;
    confirmCheck = false;
    touch(cur);
    updateBar();
  });

  window.addEventListener("hashchange", function () {
    var h = location.hash.slice(1);
    if (T[h]) switchTab(h);
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "hidden") return;
    TESTS.forEach(function (t) {
      if (timers[t.id]) { clearTimeout(timers[t.id]); timers[t.id] = null; flush(t.id); }
    });
  });

  /* ---------- start ---------- */
  function hasProgress(id) {
    var s = S[id];
    return Object.keys(s.answers).length > 0 || Object.keys(s.flags).length > 0 || s.checked;
  }
  function init() {
    TESTS.forEach(function (t) {
      try {
        var raw = localStorage.getItem(KEY + t.id);
        if (raw) adopt(t.id, JSON.parse(raw));
      } catch (e) {}
    });
    var h = location.hash.slice(1);
    if (T[h]) cur = h;
    renderTabs();
    render();
    syncNote(false);

    var c = window.claude;
    if (!c || !c.use) return;
    Promise.all([c.use("db"), c.use("user")]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return null;
      return user.id().then(function (id) { return id ? { db: db, id: id } : null; });
    }).then(function (ctx) {
      if (!ctx) return;
      dbRef = ctx.db; uid = ctx.id;
      return TESTS.reduce(function (p, t) {
        return p.then(function () {
          return dbRef.doc("data/users/" + uid + "/" + t.id).get().then(function (snap) {
            if (touched[t.id]) return;
            if (snap.exists) {
              adopt(t.id, snap.data());
              if (t.id === cur) render(); else updateBar();
            } else if (hasProgress(t.id)) {
              flush(t.id);
            }
          });
        });
      }, Promise.resolve()).then(function () { syncNote(true); });
    }).catch(function () { syncNote(false); });
  }
  init();
})();
</script>

</body></html>
